server:
  port: 9090
spring:
  application:
    name: Agentic-Finance-AI
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: postgres
    password: P@ssw0rd
  jpa:
    hibernate:
      ddl-auto: update   # validate/update use migrations (Flyway/Liquibase) in real projects, not auto-DDL
    open-in-view: false     # avoid lazy-loading surprises outside transactions
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
    mcp:
      server:
        name: Agentic-Finance-AI
        version: 1.0.0
        protocol: STREAMABLE
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
info:
  app:
    name: Agentic Finance AI
    description: AI-powered financial intelligence and agent service
    version: 0.0.1-SNAPSHOT

logging:
  level:
    com.finance.ai: DEBUG

app:
  security:
    google-client-id: ${GOOGLE_CLIENT_ID}
  ai:
    system-prompt: >
      You are a knowledgeable financial assistant for a finance application.
      Provide clear, accurate, and educational information on personal finance,
      investing concepts, budgeting, and markets. You do not provide personalized
      investment, tax, or legal advice, and you do not execute trades or access
      account data. When a question requires licensed professional advice,
      say so and recommend the user consult a qualified advisor. Be concise,
      avoid speculation, and never fabricate financial figures or facts.

resilience4j:
  timelimiter:
    instances:
      llmService:
        timeout-duration: 15s
        cancel-running-future: true
      ragChatService:
        timeout-duration: 20s
        cancel-running-future: true
  circuitbreaker:
    instances:
      llmService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 12s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      ragChatService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 15s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false   # was true — avoid leaking environment values via /actuator/info
  health:
    circuitbreakers:
      enabled: true